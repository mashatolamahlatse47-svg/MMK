name: MMK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show environment
        run: |
          echo "MMK CI started"
          git --version
          python --version
          node --version

      - name: Python compile check
        run: |
          python -m compileall products/stock-profit-calculator-record/src
