<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MMK Background Studio — AI Test</title>
</head>
<body>
  <h1>MMK Browser AI Test</h1>
  <p id="status">Loading...</p>

  <script type="module">
    import * as ort from "./vendor/onnxruntime-web/ort.min.mjs";

    const status = document.getElementById("status");

    try {
      ort.env.wasm.wasmPaths = "./vendor/onnxruntime-web/";
      ort.env.wasm.numThreads = 1;

      status.textContent = "Loading U²-NetP model...";

      const session = await ort.InferenceSession.create(
        "./models/u2netp/u2netp.onnx",
        {
          executionProviders: ["wasm"]
        }
      );

      const size = 320;
      const data = new Float32Array(1 * 3 * size * size);

      // Synthetic RGB test image.
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const i = y * size + x;
          const inside = x > 80 && x < 240 && y > 80 && y < 240;
          data[i] = inside ? 1.0 : 0.0;
          data[size * size + i] = inside ? 0.5 : 0.0;
          data[2 * size * size + i] = inside ? 0.2 : 0.0;
        }
      }

      const input = new ort.Tensor(
        "float32",
        data,
        [1, 3, size, size]
      );

      status.textContent = "Running AI inference...";

      const outputs = await session.run({
        "input.1": input
      });

      const firstOutput = outputs[session.outputNames[0]];

      status.textContent =
        "PASS — Browser AI inference works. " +
        "Output: " +
        firstOutput.dims.join(" × ") +
        " | Values: " +
        firstOutput.data.length;

      console.log("MMK BROWSER AI TEST: PASS");
      console.log("Inputs:", session.inputNames);
      console.log("Outputs:", session.outputNames);
      console.log("First output dimensions:", firstOutput.dims);
      console.log("First output values:", firstOutput.data.length);

    } catch (error) {
      status.textContent = "FAIL — " + error.message;
      console.error("MMK BROWSER AI TEST: FAIL", error);
    }
  </script>
</body>
</html>
