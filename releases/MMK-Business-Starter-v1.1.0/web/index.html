<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMK Business Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">MMK DIGITAL BUSINESS TOOLS</p>
      <h1>Business Starter</h1>
      <p class="subtitle">Simple business management for small businesses.</p>
    </div>
  </header>

  <main class="container">
    <section class="dashboard">
      <div class="welcome">
        <h2>Business Dashboard</h2>
        <p>Select a section to begin.</p>
      </div>

      <div class="menu-grid">
        <button data-section="business">Business Information</button>
        <button data-section="products">Products</button>
        <button data-section="customers">Customers</button>
        <button data-section="sales">Sales</button>
        <button data-section="reports">Reports</button>
      </div>

      <section id="workspace" class="workspace">
        <h2>Welcome to MMK Business Starter</h2>
        <p>Your business workspace is ready.</p>
      </section>
    </section>
  </main>

  <footer>
    <p>MMK Business Starter v0.1.0</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
