<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMK KPI System v1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>MMK KPI SYSTEM</h1>
        <p>Business Performance Dashboard</p>
    </header>

    <main class="container">
        <section class="kpi-grid">
            <article class="card">
                <span>Revenue</span>
                <strong id="revenue">R0.00</strong>
            </article>

            <article class="card">
                <span>Profit</span>
                <strong id="profit">R0.00</strong>
            </article>

            <article class="card">
                <span>Sales</span>
                <strong id="sales-count">0</strong>
            </article>

            <article class="card">
                <span>Stock</span>
                <strong id="stock">0</strong>
            </article>

            <article class="card">
                <span>Credit Owed</span>
                <strong id="credit">R0.00</strong>
            </article>

            <article class="card">
                <span>Expected Money</span>
                <strong id="expected-money">R0.00</strong>
            </article>
        </section>

        <section class="actions">
            <button>Products</button>
            <button>Record Sale</button>
            <button>Credit</button>
            <button>Reports</button>
        </section>
    </main>

    <footer>
        MMK Product Factory • KPI System v1
    </footer>

    <script src="app.js"></script>
</body>
</html>
